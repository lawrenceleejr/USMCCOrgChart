# Both themes paint on a transparent background; only the ink changes.
themes:
  light:
    ink: "#111111"
    muted: "#4d4d4d"
    line: "#111111"
    ring: "#111111"
    placeholder: "#111111"
  dark:
    ink: "#f2f2f2"
    muted: "#bfbfbf"
    line: "#f2f2f2"
    ring: "#f2f2f2"
    placeholder: "#f2f2f2"
