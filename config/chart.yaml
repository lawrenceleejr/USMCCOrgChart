# USMCC org chart — steering file.
#
# Everything the chart shows is declared here: the date stamp, the people,
# where they sit on the canvas, and the connector lines between them.
# Coordinates are plain SVG user units on the canvas defined below; the
# origin is the top-left corner.
#
# Anchors: any coordinate may be written as a string "<person-id>:<anchor>"
# instead of a number. Anchors are cx, cy, top, bottom, left, right and
# refer to that person's headshot circle. Use them so lines follow people
# when a headshot is nudged.

meta:
  title: USMCC Leadership
  # ---- set the date stamp here -------------------------------------------
  date: Nov 2025
  # ------------------------------------------------------------------------
  # Base name for the rendered files, e.g. out/usmcc-org-chart-light.svg
  basename: usmcc-org-chart

canvas:
  width: 2000
  height: 1379

typography:
  # Display face: title and names. Secondary face: roles, affiliations,
  # labels and the date stamp. Both are embedded in the SVG from fonts/.
  display:
    family: Lato
    stack: "Lato, 'Helvetica Neue', Helvetica, Arial, sans-serif"
  secondary:
    family: Source Sans Pro
    stack: "'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif"
  title:
    font: display
    size: 86
    weight: 700
    at: [1000, 150]
  date:
    font: secondary
    size: 27
    weight: 400
    at: [1000, 212]

# Minimum clear space, in canvas units, enforced by the layout audit that
# runs on every build (`--strict` turns a violation into a build failure).
# box_padding is also the space a computed group box leaves around whatever
# it contains.
clearance:
  circle_to_circle: 24
  circle_to_text: 14
  text_to_text: 14
  line_to_circle: 16
  line_to_text: 12
  box_padding: 22
  canvas_margin: 20

# Line weights and the headshot ring, shared by both themes.
strokes:
  connector: 3.5
  box: 1.8
  ring: 2.5
  box_radius: 16

# Text geometry for each node size. `layout: left` puts the text to the
# right of the headshot; `layout: below` centres it underneath.
styles:
  lg:
    r: 57
    gap: 16
    name: {font: display, size: 28, weight: 700}
    meta: {font: secondary, size: 18, weight: 400}
    dy: {name: -20, role: 8, affiliation: 34}
  md:
    r: 50
    gap: 15
    name: {font: display, size: 25, weight: 700}
    meta: {font: secondary, size: 17, weight: 400}
    dy: {name: -18, role: 7, affiliation: 31}
  sm:
    r: 47
    gap: 0
    name: {font: display, size: 26, weight: 700}
    meta: {font: secondary, size: 17, weight: 400}
    dy: {name: 92, role: 120, affiliation: 146}

# Rounded containers. A group with `members` is sized to enclose those
# people (headshots and their labels) with `padding` of clear space, so the
# border can never cut through a circle. `match_vertical` copies another
# group's top and height. Label `at` is an offset from the box's top-left
# corner.
groups:
  - id: strategy
    x: 40
    width: 188
    match_vertical: council
    label:
      lines: [Leadership, Strategy, Group]
      at: [94, 50]
      font: secondary
      size: 21
      align: middle
      line_height: 27
  - id: council
    padding: 22
    members: [jindariani, holmes, stratakis, pagangriso, meade, kennedy]
    label:
      lines: [Elected Leadership Council]
      at: [21, 48]
      font: secondary
      size: 21
      align: start

# Orthogonal connector lines, each a polyline of points.
connectors:
  # chair / vice-chair tie bar down to the council bus
  - [[705, 437], [1430, 437]]
  - [[1078, 437], [1078, 465]]
  - [[297, 465], [1793, 465]]
  # experimental rep -> deputy
  - [["pagangriso:cx", 647], ["pagangriso:cx", 790], [1148, 790]]
  # communications coordinator -> deputy -> coordinators
  - [["kennedy:cx", 647], ["kennedy:cx", 873]]
  - [["kennedy:cx", 790], [1960, 790]]
  - [[1190, 873], [1854, 873]]
  # accelerator rep -> working groups
  - [["stratakis:cx", 647], ["stratakis:cx", 873]]
  - [[60, 873], [650, 873]]

# Headshots are looked up in headshots/ as <id>.<jpg|jpeg|png|webp>, or by
# an explicit `photo:` filename. A missing file renders as a soft initials
# placeholder so the chart always builds.
