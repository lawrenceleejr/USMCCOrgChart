name: build chart

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cairo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -e ".[dev]"

      - name: Fetch fonts
        run: ./scripts/fetch-fonts.sh

      - name: Test
        run: python -m pytest -q

      - name: Render chart
        # --strict fails the build if anything in the layout is closer than
        # the clearances in config/chart.yaml
        run: python -m orgchart --strict --formats png webp

      - name: Upload rasters
        uses: actions/upload-artifact@v4
        with:
          name: usmcc-org-chart
          path: |
            out/*.png
            out/*.webp
          if-no-files-found: error

      - name: Upload vectors
        uses: actions/upload-artifact@v4
        with:
          name: usmcc-org-chart-svg
          path: out/*.svg
          if-no-files-found: error

  # deploy the built charts to GitHub Pages, from main only
  pages:
    needs: render
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade pip && pip install PyYAML

      - name: Download rasters
        uses: actions/download-artifact@v4
        with:
          name: usmcc-org-chart
          path: out

      - name: Download vectors
        uses: actions/download-artifact@v4
        with:
          name: usmcc-org-chart-svg
          path: out

      # enablement lets the first run turn Pages on itself where the token
      # allows it; otherwise Pages must be switched on once by hand under
      # Settings -> Pages -> Source: GitHub Actions
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - name: Build site
        run: |
          python scripts/build-site.py \
            --base-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
